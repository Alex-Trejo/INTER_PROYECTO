[pytest]
# Solo se recolectan las pruebas reales. La carpeta scripts_debug/ contiene
# utilidades sueltas que empiezan por test_ y que llegarian a tocar la base de
# datos real si pytest las ejecutara.
testpaths = tests
norecursedirs = venv scripts_debug keycloak __pycache__ migraciones

asyncio_mode = auto

addopts = -v --tb=short --strict-markers
