version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: chaski_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: chaski_alerta
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: chaski_keycloak
    environment:
      - KEYCLOAK_ADMIN=alextesis90@gmail.com
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://db:5432/chaski_alerta
      - KC_DB_USERNAME=admin
      - KC_DB_PASSWORD=password123
      - KC_HEALTH_ENABLED=true
      # Detras de un proxy HTTPS (Cloudflare Tunnel), Keycloak debe confiar en
      # X-Forwarded-Proto; si no, genera los enlaces en http:// y rompe el login.
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_STRICT=false
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./Backend/keycloak/chaski-realm.json:/opt/keycloak/data/import/chaski-realm.json
      # Tema propio del login con la identidad de Chaski Alerta
      - ./Backend/keycloak/themes/chaski:/opt/keycloak/themes/chaski
    depends_on:
      - db

volumes:
  postgis_data:
