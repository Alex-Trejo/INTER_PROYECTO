version: '3.8'
services:
  db:
    image: postgis/postgis:15-3.3
    container_name: chaski_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: chaski_alerta
    ports:
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgis_data:
